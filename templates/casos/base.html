<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vargas & Asociados</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }

        nav {
            background: #2c3e50;
            padding: 15px 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f2f2f2;
        }

        a {
            color: #2980b9;
        }

        .boton {
            display: inline-block;
            background: #2980b9;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .boton:hover {
            background: #1f6391;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'lista_clientes' %}">Clientes</a>
        <a href="{% url 'lista_casos' %}">Casos</a>
    </nav>

    <div class="contenedor">
        {% block contenido %}{% endblock %}
    </div>

    <footer>
        Vargas &amp; Asociados - Gestión de Casos
    </footer>

</body>
</html>
